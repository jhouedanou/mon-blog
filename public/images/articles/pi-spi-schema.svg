<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 880" width="640" height="880" role="img" aria-labelledby="titre desc" font-family="Helvetica, Arial, sans-serif">
  <title id="titre">Comment l'argent circule avec PI-SPI</title>
  <desc id="desc">Exemple d'un envoi d'Ecobank vers Orange Money. Dans votre appli Ecobank, vous entrez l'alias du destinataire, vous vérifiez son nom et son pays, puis vous validez. PI-SPI, le réseau de la BCEAO qui relie les banques, les mobile money et les microfinances des 8 pays de l'UEMOA, transmet l'argent en quelques secondes. Il arrive sur le compte Orange Money du destinataire. Envoyer est gratuit jusqu'à 8 000 FCFA par jour ; au-delà, les frais vont jusqu'à 0,8 % HT. Un transfert ne peut pas être annulé.</desc>

  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a7040"/>
    </marker>
  </defs>

  <rect width="640" height="880" fill="#f9fbf9"/>

  <!-- Titre -->
  <text x="320" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#121714">Comment l'argent circule</text>
  <text x="320" y="80" text-anchor="middle" font-size="18" fill="#5f6b63">Exemple : d'Ecobank vers Orange Money</text>

  <!-- 1. Expéditeur -->
  <rect x="60" y="106" width="520" height="182" rx="14" fill="#ffffff" stroke="#aab6ad" stroke-width="2"/>
  <text x="90" y="140" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0a7040">VOUS</text>
  <text x="90" y="174" font-size="25" font-weight="700" fill="#121714">Votre appli Ecobank</text>
  <text x="90" y="210" font-size="18" fill="#3f4a43">1. Entrez l'alias : numéro ou QR code</text>
  <text x="90" y="240" font-size="18" fill="#3f4a43">2. Vérifiez le nom et le pays affichés</text>
  <text x="90" y="270" font-size="18" fill="#3f4a43">3. Validez</text>

  <!-- Flèche 1 -->
  <line x1="320" y1="292" x2="320" y2="336" stroke="#0a7040" stroke-width="4" marker-end="url(#fleche)"/>

  <!-- 2. PI-SPI -->
  <rect x="30" y="346" width="580" height="176" rx="16" fill="#0a7040"/>
  <text x="320" y="394" text-anchor="middle" font-size="36" font-weight="700" fill="#ffffff">PI-SPI</text>
  <text x="320" y="424" text-anchor="middle" font-size="18" fill="#e6f4ec">Le réseau de la BCEAO</text>
  <rect x="62" y="444" width="140" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="132" y="468" text-anchor="middle" font-size="16" fill="#ffffff">Banques</text>
  <rect x="218" y="444" width="180" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="308" y="468" text-anchor="middle" font-size="16" fill="#ffffff">Mobile money</text>
  <rect x="414" y="444" width="164" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="496" y="468" text-anchor="middle" font-size="16" fill="#ffffff">Microfinances</text>
  <text x="320" y="506" text-anchor="middle" font-size="15" fill="#e6f4ec">8 pays de l'UEMOA · 24 h/24, 7 j/7</text>

  <!-- Flèche 2 -->
  <line x1="320" y1="526" x2="320" y2="570" stroke="#0a7040" stroke-width="4" marker-end="url(#fleche)"/>
  <text x="338" y="554" font-size="16" font-style="italic" fill="#0a7040">en quelques secondes</text>

  <!-- 3. Destinataire -->
  <rect x="60" y="580" width="520" height="122" rx="14" fill="#ffffff" stroke="#aab6ad" stroke-width="2"/>
  <text x="90" y="614" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0a7040">VOTRE DESTINATAIRE</text>
  <text x="90" y="648" font-size="25" font-weight="700" fill="#121714">Son compte Orange Money</text>
  <text x="90" y="682" font-size="18" fill="#3f4a43">L'argent arrive. Recevoir est gratuit.</text>

  <!-- Frais -->
  <rect x="30" y="730" width="284" height="124" rx="12" fill="#e6f4ec" stroke="#0a7040" stroke-width="1.5"/>
  <text x="52" y="764" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0a7040">FRAIS</text>
  <text x="52" y="794" font-size="17" font-weight="700" fill="#121714">Gratuit jusqu'à</text>
  <text x="52" y="816" font-size="17" font-weight="700" fill="#121714">8 000 FCFA par jour</text>
  <text x="52" y="840" font-size="15" fill="#3f4a43">Au-delà : 0,8 % HT au plus</text>

  <!-- Attention -->
  <rect x="326" y="730" width="284" height="124" rx="12" fill="#fdf1e7" stroke="#b4541a" stroke-width="1.5"/>
  <text x="348" y="764" font-size="14" font-weight="700" letter-spacing="1.5" fill="#b4541a">ATTENTION</text>
  <text x="348" y="794" font-size="17" font-weight="700" fill="#121714">Pas de retour</text>
  <text x="348" y="816" font-size="17" font-weight="700" fill="#121714">en arrière</text>
  <text x="348" y="840" font-size="15" fill="#3f4a43">Un envoi ne s'annule pas.</text>
</svg>
