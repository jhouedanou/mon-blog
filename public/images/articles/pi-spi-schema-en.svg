<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 880" width="640" height="880" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">How money moves with PI-SPI</title>
  <desc id="desc">Example of a transfer from Ecobank to Orange Money. In your Ecobank app, you enter the recipient's alias, check their name and country, then confirm. PI-SPI, the BCEAO network that links the banks, mobile money services and microfinance institutions of the 8 WAEMU countries, moves the money in a few seconds. It lands in the recipient's Orange Money account. Sending is free up to 8,000 CFA francs a day; above that, fees go up to 0.8% before tax. A transfer cannot be cancelled.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a7040"/>
    </marker>
  </defs>

  <rect width="640" height="880" fill="#f9fbf9"/>

  <!-- Title -->
  <text x="320" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#121714">How the money moves</text>
  <text x="320" y="80" text-anchor="middle" font-size="18" fill="#5f6b63">Example: from Ecobank to Orange Money</text>

  <!-- 1. Sender -->
  <rect x="60" y="106" width="520" height="182" rx="14" fill="#ffffff" stroke="#aab6ad" stroke-width="2"/>
  <text x="90" y="140" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0a7040">YOU</text>
  <text x="90" y="174" font-size="25" font-weight="700" fill="#121714">Your Ecobank app</text>
  <text x="90" y="210" font-size="18" fill="#3f4a43">1. Enter the alias: number or QR code</text>
  <text x="90" y="240" font-size="18" fill="#3f4a43">2. Check the name and country shown</text>
  <text x="90" y="270" font-size="18" fill="#3f4a43">3. Confirm</text>

  <!-- Arrow 1 -->
  <line x1="320" y1="292" x2="320" y2="336" stroke="#0a7040" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 2. PI-SPI -->
  <rect x="30" y="346" width="580" height="176" rx="16" fill="#0a7040"/>
  <text x="320" y="394" text-anchor="middle" font-size="36" font-weight="700" fill="#ffffff">PI-SPI</text>
  <text x="320" y="424" text-anchor="middle" font-size="18" fill="#e6f4ec">The BCEAO network</text>
  <rect x="62" y="444" width="140" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="132" y="468" text-anchor="middle" font-size="16" fill="#ffffff">Banks</text>
  <rect x="218" y="444" width="180" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="308" y="468" text-anchor="middle" font-size="16" fill="#ffffff">Mobile money</text>
  <rect x="414" y="444" width="164" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="496" y="468" text-anchor="middle" font-size="16" fill="#ffffff">Microfinance</text>
  <text x="320" y="506" text-anchor="middle" font-size="15" fill="#e6f4ec">8 WAEMU countries · 24/7</text>

  <!-- Arrow 2 -->
  <line x1="320" y1="526" x2="320" y2="570" stroke="#0a7040" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="338" y="554" font-size="16" font-style="italic" fill="#0a7040">in a few seconds</text>

  <!-- 3. Recipient -->
  <rect x="60" y="580" width="520" height="122" rx="14" fill="#ffffff" stroke="#aab6ad" stroke-width="2"/>
  <text x="90" y="614" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0a7040">YOUR RECIPIENT</text>
  <text x="90" y="648" font-size="25" font-weight="700" fill="#121714">Their Orange Money account</text>
  <text x="90" y="682" font-size="18" fill="#3f4a43">The money arrives. Receiving is free.</text>

  <!-- Fees -->
  <rect x="30" y="730" width="284" height="124" rx="12" fill="#e6f4ec" stroke="#0a7040" stroke-width="1.5"/>
  <text x="52" y="764" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0a7040">FEES</text>
  <text x="52" y="794" font-size="17" font-weight="700" fill="#121714">Free up to</text>
  <text x="52" y="816" font-size="17" font-weight="700" fill="#121714">8,000 FCFA a day</text>
  <text x="52" y="840" font-size="15" fill="#3f4a43">Above: 0.8% max, before tax</text>

  <!-- Attention -->
  <rect x="326" y="730" width="284" height="124" rx="12" fill="#fdf1e7" stroke="#b4541a" stroke-width="1.5"/>
  <text x="348" y="764" font-size="14" font-weight="700" letter-spacing="1.5" fill="#b4541a">ATTENTION</text>
  <text x="348" y="794" font-size="17" font-weight="700" fill="#121714">Instant and</text>
  <text x="348" y="816" font-size="17" font-weight="700" fill="#121714">irreversible</text>
  <text x="348" y="840" font-size="15" fill="#3f4a43">A transfer cannot be undone.</text>
</svg>
