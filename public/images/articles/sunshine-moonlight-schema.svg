<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 890" width="640" height="890" role="img" aria-labelledby="titre desc" font-family="Helvetica, Arial, sans-serif">
  <title id="titre">Du MacBook à l'iMac avec Sunshine et Moonlight</title>
  <desc id="desc">Sur le MacBook Pro 2017 sous Omarchy, Hyprland crée un écran virtuel nommé imac. Sunshine filme cet écran et le compresse en vidéo. La vidéo et le son passent par un câble Thunderbolt, qui sert de réseau direct entre le MacBook (10.0.0.1) et l'iMac (10.0.0.2). Sur l'iMac Retina 4K 2017, Moonlight reçoit la vidéo et l'affiche en plein écran, en 4096 × 2304. Dans l'autre sens, le clavier et la souris de l'iMac pilotent le MacBook. Il faut créer l'écran virtuel avant de lancer Sunshine. Sinon, l'iMac affiche le mauvais écran ou une image noire.</desc>

  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f5fbf"/>
    </marker>
  </defs>

  <rect width="640" height="890" fill="#f8f9fc"/>

  <!-- Titre -->
  <text x="320" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#14161c">Du MacBook à l'iMac</text>
  <text x="320" y="80" text-anchor="middle" font-size="18" fill="#5d6373">Sunshine et Moonlight, par un câble Thunderbolt</text>

  <!-- 1. MacBook -->
  <rect x="60" y="106" width="520" height="182" rx="14" fill="#ffffff" stroke="#aab2c3" stroke-width="2"/>
  <text x="90" y="140" font-size="14" font-weight="700" letter-spacing="1.5" fill="#1f5fbf">MACBOOK PRO 2017 · OMARCHY</text>
  <text x="90" y="174" font-size="25" font-weight="700" fill="#14161c">Hyprland et Sunshine</text>
  <text x="90" y="210" font-size="18" fill="#3e4452">1. Hyprland crée l'écran virtuel « imac »</text>
  <text x="90" y="240" font-size="18" fill="#3e4452">2. Sunshine filme cet écran</text>
  <text x="90" y="270" font-size="18" fill="#3e4452">3. Il le compresse en vidéo (HEVC)</text>

  <!-- Flèche 1 -->
  <line x1="320" y1="292" x2="320" y2="336" stroke="#1f5fbf" stroke-width="4" marker-end="url(#fleche)"/>

  <!-- 2. Câble -->
  <rect x="30" y="346" width="580" height="150" rx="16" fill="#1f5fbf"/>
  <text x="320" y="392" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">Câble Thunderbolt</text>
  <text x="320" y="422" text-anchor="middle" font-size="18" fill="#e6eefa">Un réseau direct, sans box ni Wi-Fi</text>
  <rect x="88" y="442" width="200" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="188" y="466" text-anchor="middle" font-size="16" fill="#ffffff">MacBook 10.0.0.1</text>
  <text x="320" y="467" text-anchor="middle" font-size="22" fill="#ffffff">↔</text>
  <rect x="352" y="442" width="200" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="452" y="466" text-anchor="middle" font-size="16" fill="#ffffff">iMac 10.0.0.2</text>

  <!-- Flèche 2 -->
  <line x1="320" y1="500" x2="320" y2="544" stroke="#1f5fbf" stroke-width="4" marker-end="url(#fleche)"/>
  <text x="338" y="528" font-size="16" font-style="italic" fill="#1f5fbf">la vidéo et le son</text>

  <!-- 3. iMac -->
  <rect x="60" y="554" width="520" height="152" rx="14" fill="#ffffff" stroke="#aab2c3" stroke-width="2"/>
  <text x="90" y="588" font-size="14" font-weight="700" letter-spacing="1.5" fill="#1f5fbf">IMAC RETINA 4K 2017 · MACOS VENTURA</text>
  <text x="90" y="622" font-size="25" font-weight="700" fill="#14161c">Moonlight</text>
  <text x="90" y="658" font-size="18" fill="#3e4452">4. Reçoit la vidéo et le son</text>
  <text x="90" y="688" font-size="18" fill="#3e4452">5. Affiche le bureau en 4096 × 2304</text>

  <!-- Dans l'autre sens -->
  <rect x="30" y="734" width="284" height="128" rx="12" fill="#e6eefa" stroke="#1f5fbf" stroke-width="1.5"/>
  <text x="52" y="768" font-size="14" font-weight="700" letter-spacing="1.5" fill="#1f5fbf">DANS L'AUTRE SENS</text>
  <text x="52" y="798" font-size="17" font-weight="700" fill="#14161c">Le clavier et la souris</text>
  <text x="52" y="820" font-size="17" font-weight="700" fill="#14161c">de l'iMac</text>
  <text x="52" y="844" font-size="15" fill="#3e4452">pilotent le MacBook.</text>

  <!-- Attention -->
  <rect x="326" y="734" width="284" height="128" rx="12" fill="#fdf1e7" stroke="#b4541a" stroke-width="1.5"/>
  <text x="348" y="768" font-size="14" font-weight="700" letter-spacing="1.5" fill="#b4541a">ATTENTION</text>
  <text x="348" y="798" font-size="17" font-weight="700" fill="#14161c">L'écran virtuel d'abord,</text>
  <text x="348" y="820" font-size="17" font-weight="700" fill="#14161c">Sunshine ensuite</text>
  <text x="348" y="844" font-size="15" fill="#3e4452">Sinon : image noire ou mauvais écran.</text>
</svg>
